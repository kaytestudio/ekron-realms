# -----------------------------------------------------------------------------
# Free Pascal options for the Free Pascal client, realms-pascal
# (Projects/realms.lpr: the Pascal Realms core compiled in, running the C++
# SDL2 sandbox from libekron_sandbox). From the repository root, once the
# CMake build has produced build/libekron_sandbox.* (Projects/build_sandbox.sh):
#
#   Projects/build_sandbox.sh
#   fpc @realms-fpc.cfg Projects/realms.lpr        -> build/realms-pascal
#
# The CMake target realms_pascal_client and Projects/realms.lpi build the same
# program. macOS universal binary: build once with -Px86_64 and once with
# -Paarch64 (each against a matching libekron_sandbox), then `lipo -create`.
# Note: FPC config files only allow comments on lines of their own.
# -----------------------------------------------------------------------------
-Mobjfpc
-Sh
-O2
-Furealms/pascal
-Firealms/pascal
-Flbuild
-Flbuild/EkronRealms.app/Contents/Frameworks
-FUbuild/fpc-units/realms-pascal-cfg
-FEbuild
-orealms-pascal
#ifdef darwin
# libekron_sandbox.dylib lives in the app bundle next to it
-k-rpath
-k@executable_path/EkronRealms.app/Contents/Frameworks
#else
-Xs
-k-rpath
-k$ORIGIN
#endif

name: Desktop client (Debian)

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'RINGSCE_v2.png'
      - 'Resources/**'
      - '!Resources/Info.plist'
      - 'Projects/**'
      - 'sys/desktop/**'
      - 'realms/**'
      - 'tests/realms/**'
      - 'tests/native/desktop_hud_layout_test.cpp'
      - 'tests/native/localization_test.cpp'
      - 'tests/native/shop_catalog_test.cpp'
      - 'tests/native/sound_test.cpp'
      - 'sys/linux/**'
      - 'tests/pascal/**'
      - '.gitmodules'
      - 'tools/SDL2-for-Pascal'
      - 'sys/android/app/src/main/cpp/**'
      - 'sys/android/app/src/main/assets/**'
      - '.github/workflows/desktop-debian.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'RINGSCE_v2.png'
      - 'Resources/**'
      - '!Resources/Info.plist'
      - 'Projects/**'
      - 'sys/desktop/**'
      - 'realms/**'
      - 'tests/realms/**'
      - 'tests/native/desktop_hud_layout_test.cpp'
      - 'tests/native/localization_test.cpp'
      - 'tests/native/shop_catalog_test.cpp'
      - 'tests/native/sound_test.cpp'
      - 'sys/linux/**'
      - 'tests/pascal/**'
      - '.gitmodules'
      - 'tools/SDL2-for-Pascal'
      - 'sys/android/app/src/main/cpp/**'
      - 'sys/android/app/src/main/assets/**'
      - '.github/workflows/desktop-debian.yml'

permissions:
  contents: read

jobs:
  linux-deb:
    name: Linux Debian package (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libgl1-mesa-dev \
            fpc \
            fp-units-fcl \
            file \
            dpkg-dev

      - name: Configure and build Linux desktop client
        shell: bash
        run: |
          set -o pipefail
          {
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DENABLE_FPC_CLIENT=ON \
              -DENABLE_PASCAL_CORE=ON &&
            cmake --build build -j"$(nproc)" &&
            test -x build/ekron-realms &&
            test -x build/realms-launcher &&
            test -f build/librealms_core.so &&
            test -x build/realms-pascal &&
            test -f build/libekron_sandbox.so &&
            test -f build/librealms_game.so
          } 2>&1 | tee /tmp/linux-build.log || {
            tail -n 8 /tmp/linux-build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::[linux-build] $line"
            done
            exit 1
          }

      - name: Run CTest smoke checks
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure -V

      - name: Pascal SDL2 bindings for the sys layer (tools/SDL2-for-Pascal submodule)
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 tools/SDL2-for-Pascal
          mkdir -p /tmp/sdl2u
          cd Projects
          fpc -Mobjfpc -FU/tmp/sdl2u -FE/tmp/sdl2u ../tests/pascal/sdl2_sys_smoke.lpr
          /tmp/sdl2u/sdl2_sys_smoke

      - name: Build and verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          (cd build && cpack -G DEB)
          DEB_PKG="$(ls build/ekron-realms_*.deb | head -n 1)"
          test -f "$DEB_PKG"
          dpkg-deb --info "$DEB_PKG"

          sudo apt-get install -y "./$DEB_PKG"
          /usr/bin/ekron-realms --version
          /usr/bin/ekron-realms --headless-smoke
          # The packaged sandbox must boot on the Free Pascal Quake 2 core.
          test -f /usr/lib/ekron-realms/librealms_core.so
          /usr/bin/ekron-realms --engine-info
          REALMS_CORE=pascal /usr/bin/ekron-realms --headless-smoke | tee /tmp/pascal-smoke.log
          grep -q 'realmsCore=pascal-quake2' /tmp/pascal-smoke.log
          # Map mode hosts the Quake 2 game module (game/) through realms::GameServer.
          test -f /usr/lib/ekron-realms/librealms_game.so
          /usr/bin/ekron-realms --engine-info | tee /tmp/engine-info.log
          grep -q 'Quake 2 game API 3' /tmp/engine-info.log
          /usr/bin/realms-launcher --version
          /usr/bin/realms-launcher --headless-smoke
          # Free Pascal program: Pascal Realms core linked in, C++ SDL2 sandbox.
          test -f /usr/lib/ekron-realms/libekron_sandbox.so
          /usr/bin/realms-pascal --version
          /usr/bin/realms-pascal --engine-info | tee /tmp/realms-pascal-info.log
          grep -q 'Origin:   linked' /tmp/realms-pascal-info.log
          /usr/bin/realms-pascal --headless-smoke | tee /tmp/realms-pascal-smoke.log
          grep -q 'realmsCore=pascal-quake2' /tmp/realms-pascal-smoke.log

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: ekron-realms-linux-deb
          path: build/ekron-realms_*.deb
          if-no-files-found: error

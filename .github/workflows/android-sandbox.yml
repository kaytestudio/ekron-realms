name: Native Android sandbox

on:
  workflow_dispatch:
  # release.yml builds the release assets with this workflow
  workflow_call:
  push:
    # branches only: a version tag is built once, by release.yml
    branches: ['**']
    paths:
      - 'sys/android/**'
      - 'tests/native/**'
      - 'tests/realms/**'
      - 'realms/**'
      - 'tools/*android*'
      - 'tools/validate_i18n.py'
      - 'tools/check_glsl_keywords.py'
      - 'game/qcommon/**'
      - '.github/workflows/android-sandbox.yml'
  pull_request:
    paths:
      - 'sys/android/**'
      - 'tests/native/**'
      - 'tests/realms/**'
      - 'realms/**'
      - 'tools/*android*'
      - 'tools/validate_i18n.py'
      - 'tools/check_glsl_keywords.py'
      - 'game/qcommon/**'
      - '.github/workflows/android-sandbox.yml'

permissions:
  contents: read

jobs:
  # Realms Engine: compile the Free Pascal Quake 2 core for Android through
  # the bridge ABI (librealms_core.so for arm64-v8a devices and x86_64
  # emulators). FPC 3.2 has no Android cross compiler in apt, so one is built
  # from the official sources (compiler + RTL only) and cached.
  realms-pascal-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FPC_SOURCE_TAG: release_3_2_2
      FPC_ANDROID_PREFIX: /home/runner/fpc-android
      ANDROID_API: '30'
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal and GNU binutils for Android CPUs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fpc binutils-aarch64-linux-gnu
          fpc -iV
          aarch64-linux-gnu-ld --version | head -n 1
          x86_64-linux-gnu-ld --version | head -n 1

      - name: Locate Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'ndk;26.1.10909125' >/dev/null
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Restore FPC Android cross compilers
        id: fpc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FPC_ANDROID_PREFIX }}
          key: fpc-android-${{ env.FPC_SOURCE_TAG }}-ubuntu-24.04-${{ hashFiles('realms/pascal/fpc_android_toolchain.sh') }}

      - name: Build FPC Android cross compilers (aarch64, x86_64)
        if: steps.fpc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://codeload.github.com/fpc/FPCSource/tar.gz/refs/tags/$FPC_SOURCE_TAG" | tar xz -C /tmp
          if ! realms/pascal/fpc_android_toolchain.sh "/tmp/FPCSource-$FPC_SOURCE_TAG" "$FPC_ANDROID_PREFIX" aarch64 x86_64 > /tmp/fpc-cross.log 2>&1; then
            tail -n 60 /tmp/fpc-cross.log
            echo "::error title=FPC Android cross compiler::$(grep -E 'Error|error|Fatal' /tmp/fpc-cross.log | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -n 5 /tmp/fpc-cross.log

      - name: Compile librealms_core.so (Free Pascal core) and librealms_game.so (Quake 2 game module) for Android
        shell: bash
        run: |
          set -euo pipefail
          for target in android-aarch64:arm64-v8a android-x86_64:x86_64 game-android-aarch64:arm64-v8a game-android-x86_64:x86_64; do
            abi="${target#*:}" name="${target%%:*}"
            if ! realms/pascal/build_core.sh "$name" "out/realms-pascal-android/$abi" > "/tmp/$name.log" 2>&1; then
              cat "/tmp/$name.log"
              echo "::error title=$name ($abi)::$(grep -E 'Error|error|Fatal|undefined' "/tmp/$name.log" | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
              exit 1
            fi
            tail -n 3 "/tmp/$name.log"
          done
          # unstripped copy for the emulator test
          if ! REALMS_GAME_STRIP=0 realms/pascal/build_core.sh game-android-x86_64 out/realms-game-android-debug/x86_64 > /tmp/game-debug.log 2>&1; then
            cat /tmp/game-debug.log
            echo "::error title=game-android-x86_64 (unstripped)::$(grep -E 'Error|error|Fatal|undefined' /tmp/game-debug.log | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -n 3 /tmp/game-debug.log

      - name: Verify Android libraries (ABI, exports, no glibc, no text relocations, 16 KB pages)
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local abi="$1" machine="$2" name="${3:-librealms_core.so}" entry="${4:-realms_pascal_get_api}"
            local lib="out/realms-pascal-android/$1/$name"
            test -f "$lib"
            file "$lib"
            readelf -h "$lib" | grep "Machine:.*$machine" >/dev/null || { echo "::error::$abi: wrong machine"; exit 1; }
            readelf -d "$lib" | grep "SONAME.*$name" >/dev/null || { echo "::error::$abi: $name: missing SONAME"; exit 1; }
            readelf --dyn-syms -W "$lib" | grep " $entry\$" >/dev/null || { echo "::error::$abi: $entry not exported by $name"; exit 1; }
            if readelf -d "$lib" | grep TEXTREL >/dev/null; then echo "::error::$abi: text relocations (rejected by Android)"; exit 1; fi
            local needed; needed="$(readelf -d "$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | tr '\n' ' ')"
            echo "$abi NEEDED: $needed"
            for n in $needed; do
              case "$n" in libc.so|libdl.so|libm.so|liblog.so) ;; *) echo "::error::$abi: unexpected dependency $n"; exit 1 ;; esac
            done
            if readelf -V "$lib" | grep GLIBC >/dev/null; then echo "::error::$abi: glibc symbol versions"; exit 1; fi
            readelf -l -W "$lib" | awk '$1=="LOAD"{print $NF}' | while read -r align; do
              [ $((align)) -ge 16384 ] || { echo "::error::$abi: LOAD alignment $align < 16 KB"; exit 1; }
            done
            ls -l "$lib"
          }
          check arm64-v8a AArch64
          check x86_64 'X86-64'
          # the Quake 2 game module (game/): GetGameAPI for realms::GameServer
          check arm64-v8a AArch64 librealms_game.so GetGameAPI
          check x86_64 'X86-64' librealms_game.so GetGameAPI

      - uses: actions/upload-artifact@v4
        with:
          name: realms-pascal-android
          path: out/realms-pascal-android
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: realms-game-android-debug
          path: out/realms-game-android-debug
          if-no-files-found: error

  # Run the bridge conformance suite on an Android emulator against the
  # Free Pascal core (and the C++ reference core for comparison).
  realms-pascal-device:
    needs: realms-pascal-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: realms-pascal-android
          path: out/realms-pascal-android

      - uses: actions/download-artifact@v4
        with:
          name: realms-game-android-debug
          path: out/realms-game-android-debug

      - name: Cross-compile the bridge test for x86_64 Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'ndk;26.1.10909125' >/dev/null
          CLANG="$SDK_ROOT/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$CLANG" --target=x86_64-linux-android30 -std=c++17 -O2 -Wall -Wextra -Werror -static-libstdc++ \
            -Irealms/include tests/realms/realms_bridge_test.cpp \
            realms/src/Engine.cpp realms/src/NativeCore.cpp realms/src/NativeCModel.cpp realms/src/SandboxBoot.cpp realms/src/GameSave.cpp realms/src/MeshMap.cpp realms/src/MapGeometry.cpp realms/src/MapLighting.cpp realms/src/MapWalker.cpp \
            -o out/realms_bridge_test
          file out/realms_bridge_test
          # The Quake 2 module (realms_quake2 + the shared map mode) with the
          # game module, as the app runs it.
          S=sys/android/app/src/main/cpp
          "$CLANG" --target=x86_64-linux-android30 -std=c++17 -O2 -Wall -Wextra -Werror -static-libstdc++ \
            -Irealms/include -Itests/realms -I$S tests/realms/quake2_module_test.cpp $S/Quake2View.cpp $S/MapSession.cpp \
            realms/src/Engine.cpp realms/src/NativeCore.cpp realms/src/NativeCModel.cpp realms/src/SandboxBoot.cpp realms/src/GameSave.cpp realms/src/MeshMap.cpp realms/src/MapGeometry.cpp realms/src/MapLighting.cpp realms/src/MapWalker.cpp \
            realms/src/Q2Pmove.cpp realms/src/GameServer.cpp realms/src/GameClient.cpp realms/src/GameView.cpp realms/src/GameEffects.cpp realms/src/GameSound.cpp realms/src/GameLayout.cpp realms/src/GameHudCanvas.cpp realms/src/Md3Model.cpp realms/src/Image.cpp realms/src/MapSky.cpp realms/src/MapTextures.cpp realms/src/Quake2Module.cpp \
            -o out/realms_quake2_module_test
          file out/realms_quake2_module_test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Realms bridge suite on the emulator (Pascal + C++ cores)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REALMS_MODULE_RUNS: 10
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash realms/pascal/android_device_test.sh out/realms_bridge_test out/realms-pascal-android/x86_64/librealms_core.so out/realms_quake2_module_test out/realms-game-android-debug/x86_64/librealms_game.so

  apk:
    needs: realms-pascal-core
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The APK ships the Free Pascal core; realms::Engine dlopens it from the
      # app's native library dir (ABIs without it use the C++ reference core).
      - uses: actions/download-artifact@v4
        with:
          name: realms-pascal-android
          path: sys/android/app/src/main/jniLibs

      - name: Test native world logic
        shell: bash
        run: |
          set -euo pipefail

          run_test() {
            local out="$1"
            local opt="$2"
            shift 2
            g++ -std=c++17 "$opt" -Wall -Wextra -Werror -pedantic "$@" -o "/tmp/$out"
            "/tmp/$out"
          }

          run_test ekron-contact-energy -O2 tests/native/contact_energy_test.cpp
          run_test ekron-fpv-drone -O2 tests/native/fpv_drone_test.cpp
          run_test ekron-fpv-assets -O2 tests/native/fpv_assets_test.cpp sys/android/app/src/main/cpp/GltfScene.cpp sys/android/app/src/main/cpp/ImageDecode.cpp
          run_test ekron-oriented-grab -O2 tests/native/oriented_grab_test.cpp
          run_test ekron-advanced-physics-test -O2 tests/native/advanced_physics_test.cpp
          run_test ekron-multi-contact-test -O2 tests/native/multi_contact_test.cpp
          run_test ekron-contact-test -O2 tests/native/contact_system_test.cpp
          run_test ekron-city-contact-test -O1 tests/native/city_contact_test.cpp sys/android/app/src/main/cpp/GltfScene.cpp sys/android/app/src/main/cpp/ImageDecode.cpp
          run_test ekron-pickup-settle-test -O2 tests/native/pickup_settle_delete_test.cpp
          run_test ekron-fence-gravity-test -O2 tests/native/fence_gravity_test.cpp
          run_test ekron-swept-floor-test -O2 tests/native/swept_floor_test.cpp
          run_test ekron-rest-test -O2 tests/native/rest_stability_test.cpp
          run_test ekron-cleanup-test -O2 tests/native/object_cleanup_test.cpp
          run_test ekron-freeze-test -O2 tests/native/freeze_edge_test.cpp
          run_test ekron-interaction-test -O2 tests/native/interaction_test.cpp
          run_test ekron-recovery-test -O2 tests/native/world_recovery_test.cpp
          run_test ekron-fence-jump-test -O2 tests/native/fence_jump_test.cpp
          run_test ekron-indoor-test -O2 tests/native/indoor_placement_test.cpp
          run_test ekron-dynamics-test -O2 tests/native/object_dynamics_test.cpp
          run_test ekron-raycast-test -O2 tests/native/raycast_placement_test.cpp
          run_test ekron-raycast-watertight-test -O2 tests/native/raycast_watertight_test.cpp
          run_test ekron-tools-test -O2 tests/native/tool_interaction_test.cpp
          run_test ekron-fence-test -O2 tests/native/fence_collision_test.cpp
          run_test ekron-physics-test -O2 tests/native/player_physics_test.cpp
          run_test ekron-world-test -O2 tests/native/sandbox_world_test.cpp
          run_test ekron-building-test -O2 tests/native/building_collision_test.cpp
          run_test ekron-placement-test -O2 tests/native/level_placement_test.cpp
          run_test ekron-debug-test -O2 tests/native/debug_player_test.cpp
          run_test ekron-texture-test -O2 tests/native/texture_mesh_test.cpp
          run_test ekron-gltf-test -O1 tests/native/gltf_scene_test.cpp sys/android/app/src/main/cpp/GltfScene.cpp sys/android/app/src/main/cpp/ImageDecode.cpp
          run_test realms-bridge-test -O2 -Irealms/include tests/realms/realms_bridge_test.cpp realms/src/Engine.cpp realms/src/NativeCore.cpp realms/src/NativeCModel.cpp realms/src/SandboxBoot.cpp realms/src/GameSave.cpp realms/src/MeshMap.cpp realms/src/MapGeometry.cpp realms/src/MapLighting.cpp realms/src/MapWalker.cpp -ldl
          # Game sound: every shipped .ogg decodes, LICENSE.md credits it; mixer, director, play/s_volume.
          S=sys/android/app/src/main/cpp
          # The Quake 2 module and the shared map mode (no game module on this host: exit 77 skips that part).
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Irealms/include -Itests/realms -I$S tests/realms/quake2_module_test.cpp $S/Quake2View.cpp $S/MapSession.cpp \
            realms/src/Engine.cpp realms/src/NativeCore.cpp realms/src/NativeCModel.cpp realms/src/SandboxBoot.cpp realms/src/GameSave.cpp realms/src/MeshMap.cpp realms/src/MapGeometry.cpp realms/src/MapLighting.cpp realms/src/MapWalker.cpp \
            realms/src/Q2Pmove.cpp realms/src/GameServer.cpp realms/src/GameClient.cpp realms/src/GameView.cpp realms/src/GameEffects.cpp realms/src/GameSound.cpp realms/src/GameLayout.cpp realms/src/GameHudCanvas.cpp realms/src/Md3Model.cpp realms/src/Image.cpp realms/src/MapSky.cpp realms/src/MapTextures.cpp realms/src/Quake2Module.cpp -ldl \
            -o /tmp/realms-quake2-module-test
          status=0; REALMS_CORE= /tmp/realms-quake2-module-test || status=$?
          [ "$status" = 0 ] || [ "$status" = 77 ] || { echo "::error::realms_quake2_module_test failed ($status)"; exit 1; }
          # The qbsp3/qvis3/qrad3 map (collision, areas, PVS, lightmaps; the game part skips).
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Irealms/include -I$S tests/realms/q2_compiled_map_test.cpp $S/Quake2View.cpp $S/MapSession.cpp \
            realms/src/Engine.cpp realms/src/NativeCore.cpp realms/src/NativeCModel.cpp realms/src/SandboxBoot.cpp realms/src/GameSave.cpp realms/src/MeshMap.cpp realms/src/MapGeometry.cpp realms/src/MapLighting.cpp realms/src/MapWalker.cpp \
            realms/src/Q2Pmove.cpp realms/src/GameServer.cpp realms/src/GameClient.cpp realms/src/GameView.cpp realms/src/GameEffects.cpp realms/src/GameSound.cpp realms/src/GameLayout.cpp realms/src/GameHudCanvas.cpp realms/src/Md3Model.cpp realms/src/Image.cpp realms/src/MapSky.cpp realms/src/MapTextures.cpp realms/src/Quake2Module.cpp -ldl \
            -o /tmp/realms-q2-compiled-map-test
          status=0; REALMS_CORE= /tmp/realms-q2-compiled-map-test --map tests/realms/maps/q2room.bsp || status=$?
          [ "$status" = 0 ] || [ "$status" = 77 ] || { echo "::error::realms_q2_compiled_map_test failed ($status)"; exit 1; }
          REALMS_CORE=native run_test ekron-sound-test -O2 -Irealms/include -I$S tests/native/sound_test.cpp $S/SoundDecode.cpp $S/SoundMixer.cpp $S/SoundDirector.cpp $S/SoundSystem.cpp $S/GameSoundPlayer.cpp realms/src/GameSound.cpp realms/src/Engine.cpp realms/src/NativeCore.cpp realms/src/NativeCModel.cpp realms/src/SandboxBoot.cpp realms/src/GameSave.cpp realms/src/MeshMap.cpp realms/src/MapGeometry.cpp realms/src/MapLighting.cpp realms/src/MapWalker.cpp -ldl -lpthread

      - name: Validate translations (English, Russian, Portuguese (Portugal), Spanish (Spain))
        run: python3 tools/validate_i18n.py

      - name: Validate GLSL ES shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          python3 tools/validate_android_shaders.py
          python3 tools/check_glsl_keywords.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android tools using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;26.1.10909125' \
            'cmake;3.22.1' 2>&1 | tee /tmp/android-tools.log

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native debug APK
        working-directory: sys/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/android-build.log

      - name: Verify the APK ships the Realms Pascal core
        shell: bash
        run: |
          set -euo pipefail
          APK=sys/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'lib/.*/lib(realms|realms_core|realms_game)\.so' | tee /tmp/apk-libs.txt
          for abi in arm64-v8a x86_64; do
            grep -q "lib/$abi/librealms_core.so" /tmp/apk-libs.txt || { echo "::error::APK is missing lib/$abi/librealms_core.so"; exit 1; }
            grep -q "lib/$abi/librealms_game.so" /tmp/apk-libs.txt || { echo "::error::APK is missing lib/$abi/librealms_game.so"; exit 1; }
            grep -q "lib/$abi/librealms.so" /tmp/apk-libs.txt || { echo "::error::APK is missing lib/$abi/librealms.so"; exit 1; }
          done
          # The app version is the CMake project version (app/build.gradle.kts).
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          want="$(sed -nE 's/^project\(EkronRealms VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          badging="$("$SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$badging"
          grep -q "versionName='$want'" <<< "$badging" || { echo "::error::APK versionName is not $want: $badging"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ekron-native-sandbox-debug
          path: sys/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  # Launch the real debug APK and require it to start on the Free Pascal core
  # it ships (logcat: "Realms engine ready: core=pascal-quake2").
  realms-apk-smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ekron-native-sandbox-debug
          path: out/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the APK on the emulator and check the Realms core
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash realms/pascal/android_app_smoke.sh out/apk/app-debug.apk pascal-quake2 game

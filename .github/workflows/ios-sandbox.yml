name: Native iOS sandbox

on:
  workflow_dispatch:
  push:
    paths:
      - 'sys/ios/**'
      - 'sys/android/app/src/main/cpp/**'
      - 'sys/android/app/src/main/assets/**'
      - 'tests/native/**'
      - 'tests/realms/**'
      - 'realms/**'
      - 'tools/*ios*'
      - 'tools/validate_i18n.py'
      - 'tools/*shader*'
      - '.github/workflows/ios-sandbox.yml'
  pull_request:
    paths:
      - 'sys/ios/**'
      - 'sys/android/app/src/main/cpp/**'
      - 'sys/android/app/src/main/assets/**'
      - 'tests/native/**'
      - 'tests/realms/**'
      - 'realms/**'
      - 'tools/*ios*'
      - 'tools/validate_i18n.py'
      - 'tools/*shader*'
      - '.github/workflows/ios-sandbox.yml'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          submodules: false

      - name: Test native world logic
        shell: bash
        run: |
          set -euo pipefail

          clang++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic \
            -c sys/android/app/src/main/cpp/GltfScene.cpp -o /tmp/ekron-GltfScene.o
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -c sys/android/app/src/main/cpp/ImageDecode.cpp -o /tmp/ekron-ImageDecode.o

          # Run every test even if one fails, and surface each failure as an
          # annotation (test name, exit code and the tail of its output) so it
          # is visible from the PR checks without downloading the raw log.
          failed=()
          run_test() {
            local out="$1"
            local opt="$2"
            shift 2
            local rc=0
            echo "::group::$out"
            if ! clang++ -std=c++17 "$opt" -Wall -Wextra -Werror -pedantic "$@" -o "/tmp/$out" 2> "/tmp/$out.build.log"; then
              cat "/tmp/$out.build.log"
              echo "::error title=$out (compile)::$(tail -n 6 "/tmp/$out.build.log" | tr '\n' ' ' | cut -c1-900)"
              failed+=("$out")
              echo "::endgroup::"
              return 0
            fi
            "/tmp/$out" > "/tmp/$out.log" 2>&1 || rc=$?
            cat "/tmp/$out.log"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$out (exit $rc)::$(tail -n 8 "/tmp/$out.log" | tr '\n' ' ' | cut -c1-900)"
              failed+=("$out")
            fi
            echo "::endgroup::"
          }

          run_test ekron-contact-energy -O2 tests/native/contact_energy_test.cpp
          run_test ekron-fpv-drone -O2 tests/native/fpv_drone_test.cpp
          run_test ekron-fpv-assets -O2 tests/native/fpv_assets_test.cpp /tmp/ekron-GltfScene.o /tmp/ekron-ImageDecode.o
          run_test ekron-oriented-grab -O2 tests/native/oriented_grab_test.cpp
          run_test ekron-advanced-physics-test -O2 tests/native/advanced_physics_test.cpp
          run_test ekron-multi-contact-test -O2 tests/native/multi_contact_test.cpp
          run_test ekron-contact-test -O2 tests/native/contact_system_test.cpp
          run_test ekron-city-contact-test -O1 tests/native/city_contact_test.cpp /tmp/ekron-GltfScene.o /tmp/ekron-ImageDecode.o
          run_test ekron-pickup-settle-test -O2 tests/native/pickup_settle_delete_test.cpp
          run_test ekron-fence-gravity-test -O2 tests/native/fence_gravity_test.cpp
          run_test ekron-swept-floor-test -O2 tests/native/swept_floor_test.cpp
          run_test ekron-rest-test -O2 tests/native/rest_stability_test.cpp
          run_test ekron-cleanup-test -O2 tests/native/object_cleanup_test.cpp
          run_test ekron-freeze-test -O2 tests/native/freeze_edge_test.cpp
          run_test ekron-interaction-test -O2 tests/native/interaction_test.cpp
          run_test ekron-recovery-test -O2 tests/native/world_recovery_test.cpp
          run_test ekron-fence-jump-test -O2 tests/native/fence_jump_test.cpp
          run_test ekron-indoor-test -O2 tests/native/indoor_placement_test.cpp
          run_test ekron-dynamics-test -O2 tests/native/object_dynamics_test.cpp
          run_test ekron-raycast-test -O2 tests/native/raycast_placement_test.cpp
          run_test ekron-raycast-watertight-test -O2 tests/native/raycast_watertight_test.cpp
          run_test ekron-tools-test -O2 tests/native/tool_interaction_test.cpp
          run_test ekron-fence-test -O2 tests/native/fence_collision_test.cpp
          run_test ekron-physics-test -O2 tests/native/player_physics_test.cpp
          run_test ekron-world-test -O2 tests/native/sandbox_world_test.cpp
          run_test ekron-building-test -O2 tests/native/building_collision_test.cpp
          run_test ekron-placement-test -O2 tests/native/level_placement_test.cpp
          run_test ekron-debug-test -O2 tests/native/debug_player_test.cpp
          run_test ekron-texture-test -O2 tests/native/texture_mesh_test.cpp
          run_test ekron-gltf-test -O1 tests/native/gltf_scene_test.cpp /tmp/ekron-GltfScene.o /tmp/ekron-ImageDecode.o
          run_test realms-bridge-test -O2 -Irealms/include tests/realms/realms_bridge_test.cpp realms/src/Engine.cpp realms/src/NativeCore.cpp realms/src/SandboxBoot.cpp

          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error title=native tests::${#failed[@]} failing: ${failed[*]}"
            exit 1
          fi

      - name: Validate translations (English, Russian, Portuguese (Portugal))
        run: python3 tools/validate_i18n.py

      - name: Validate shaders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_ios_shaders.py

      - name: Install Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          brew list fpc >/dev/null 2>&1 || brew install fpc
          ver="$(fpc -iV)"
          echo "FPC $ver ($(fpc -iSP)-$(fpc -iSO)), $(xcodebuild -version | head -n 1)"
          {
            echo "FPC_VERSION=$ver"
            echo "FPC_SOURCE_TAG=release_${ver//./_}"
            echo "FPC_IOS_PREFIX=$HOME/fpc-ios"
            echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | tr -cd '0-9.')"
          } >> "$GITHUB_ENV"

      - name: Restore FPC iOS runtime library
        id: fpc-ios-cache
        uses: actions/cache@v4
        with:
          path: ~/fpc-ios
          key: fpc-ios-${{ runner.arch }}-${{ env.FPC_VERSION }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('realms/pascal/fpc_ios_toolchain.sh') }}

      - name: Build FPC iOS runtime library (aarch64-ios)
        if: steps.fpc-ios-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://codeload.github.com/fpc/FPCSource/tar.gz/refs/tags/$FPC_SOURCE_TAG" | tar xz -C "$RUNNER_TEMP"
          realms/pascal/fpc_ios_toolchain.sh "$RUNNER_TEMP/FPCSource-$FPC_SOURCE_TAG" "$FPC_IOS_PREFIX" > /tmp/fpc-ios-rtl.log 2>&1 || {
            tail -n 60 /tmp/fpc-ios-rtl.log
            echo "::error title=FPC iOS RTL::$(grep -E 'Error|Fatal|error:' /tmp/fpc-ios-rtl.log | head -n 6 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }
          tail -n 3 /tmp/fpc-ios-rtl.log

      # iOS binaries cannot run on the runner, so the static packaging (one
      # prelinked object, RTL started from __mod_init_func) is proven on
      # macOS arm64 with the identical pipeline, then built for iOS devices.
      - name: Run the bridge suite on the statically linked Pascal core (macOS arm64)
        shell: bash
        run: |
          set -euo pipefail
          realms/pascal/build_core.sh macos-arm64-static build/realms-macos-static > /tmp/pascal-static.log 2>&1 || {
            tail -n 40 /tmp/pascal-static.log
            echo "::error title=Pascal static core (macOS)::$(grep -E 'Error|Fatal|error' /tmp/pascal-static.log | head -n 6 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }
          tail -n 2 /tmp/pascal-static.log
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Irealms/include -DREALMS_PASCAL_STATIC \
            tests/realms/realms_bridge_test.cpp realms/src/Engine.cpp realms/src/NativeCore.cpp realms/src/SandboxBoot.cpp \
            build/realms-macos-static/librealms_core.a -o /tmp/realms-bridge-static
          rc=0
          /tmp/realms-bridge-static --pascal static > /tmp/realms-static.log 2>&1 || rc=$?
          cat /tmp/realms-static.log
          if [ "$rc" -ne 0 ] || ! grep -Eq '^\[realms\] [0-9]+ checks, 0 failures \(pascal-quake2\)$' /tmp/realms-static.log; then
            echo "::error title=Pascal static core (exit $rc)::$(tail -n 8 /tmp/realms-static.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi

      - name: Compile librealms_core.a (Free Pascal core) for iOS devices
        shell: bash
        run: |
          set -euo pipefail
          realms/pascal/build_core.sh ios-arm64 > /tmp/pascal-ios.log 2>&1 || {
            tail -n 40 /tmp/pascal-ios.log
            echo "::error title=Pascal core (iOS)::$(grep -E 'Error|Fatal|error' /tmp/pascal-ios.log | head -n 6 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }
          tail -n 3 /tmp/pascal-ios.log
          lipo -info build/realms-ios/librealms_core.a
          otool -l build/realms-ios/librealms_core.a | grep -A4 LC_BUILD_VERSION | head -n 5
          cat build/realms-ios/RealmsPascal.generated.xcconfig

      - name: Build and archive unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          IOS_PROJECT="sys/ios/realms/realms.xcodeproj"
          IOS_SCHEME="realms iOS"
          ARCHIVE_PATH="/tmp/ekron-ios-sandbox.xcarchive"
          IPA_DIR="/tmp/ipa-out"
          rm -rf "$ARCHIVE_PATH" "$IPA_DIR" /tmp/ekron-native-sandbox-debug.ipa
          mkdir -p "$IPA_DIR/Payload"

          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee /tmp/ios-build.log

          APP_BUNDLE="$ARCHIVE_PATH/Products/Applications/realms.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "::error::Archived app bundle not found at $APP_BUNDLE"
            exit 1
          fi
          test -f "$APP_BUNDLE/models/abandoned_city_street_for_games.glb"
          test -f "$APP_BUNDLE/default.metallib"

          # The device build must run on the Free Pascal core.
          if ! grep -q 'librealms_core.a' /tmp/ios-build.log; then
            echo "::error title=Pascal core (iOS)::librealms_core.a was not on the app link line"
            exit 1
          fi
          if ! strings -a "$APP_BUNDLE/realms" | grep 'pascal-quake2' >/dev/null; then
            echo "::error title=Pascal core (iOS)::the app binary does not contain the Pascal core"
            exit 1
          fi
          echo "realms.app links the Free Pascal core (librealms_core.a)"

          cp -R "$APP_BUNDLE" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && zip -qry /tmp/ekron-native-sandbox-debug.ipa Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: ekron-native-sandbox-debug-ipa
          path: /tmp/ekron-native-sandbox-debug.ipa
          if-no-files-found: error

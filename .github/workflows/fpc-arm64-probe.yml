name: Free Pascal aarch64-win64 probe (temporary)

# Temporary diagnostics: why programs from Free Pascal's aarch64-win64
# compiler crash, and whether a DLL (what the game loads) works.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/fpc-arm64-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: FPC aarch64-win64 probe (${{ matrix.source }})
    runs-on: windows-11-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [upstream, fork]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install LLVM-MinGW (CLANGARM64) toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          path-type: minimal
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-lld
            git

      - name: Restore the bootstrap Free Pascal (Lazarus, x86_64)
        id: fpc-cache
        uses: actions/cache@v5
        with:
          path: C:\lazarus\fpc
          key: fpc-lazarus-win64-v1

      - name: Install the bootstrap Free Pascal (Lazarus, x86_64)
        if: steps.fpc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install lazarus -y --no-progress

      - name: Free Pascal sources
        run: |
          set -euo pipefail
          if [ "${{ matrix.source }}" = upstream ]; then
            url=https://github.com/fpc/FPCSource.git
            ref=37918075fb773569af2d4e9fc1ddb99b0b411a48
            git init -q fpcsrc && git -C fpcsrc fetch -q --depth 1 "$url" "$ref" && git -C fpcsrc checkout -q FETCH_HEAD
          else
            git clone -q --depth 1 https://gitlab.com/tino-teuber/fpc-source.git fpcsrc
          fi
          echo "::notice::${{ matrix.source }} at $(git -C fpcsrc rev-parse HEAD) ($(git -C fpcsrc log -1 --format=%cs))"

      - name: Build ppcrossa64 and the aarch64-win64 RTL
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ppc = Get-ChildItem C:\lazarus\fpc -Recurse -Filter ppcx64.exe |
            Where-Object { $_.DirectoryName -like '*\x86_64-win64' } | Select-Object -First 1
          $bin = $ppc.DirectoryName
          $clang = Join-Path $env:MSYS2_ROOT 'clangarm64\bin'
          $env:PATH = "$bin;$clang;$env:SystemRoot\System32;$env:SystemRoot"
          $ErrorActionPreference = 'Continue'
          & "$bin\make.exe" -C fpcsrc/compiler cycle "PP=$($ppc.FullName -replace '\\','/')" CPU_TARGET=aarch64 OS_TARGET=win64 BINUTILSPREFIX= NoNativeBinaries=1 *>&1 | Out-File fpc-cycle.log
          if ($LASTEXITCODE) { Get-Content fpc-cycle.log -Tail 6 | ForEach-Object { "::error::[cycle] $_" }; exit 1 }
          $cross = (Resolve-Path fpcsrc\compiler\ppcrossa64.exe).Path -replace '\\','/'
          & "$bin\make.exe" -C fpcsrc/rtl all "FPC=$cross" CPU_TARGET=aarch64 OS_TARGET=win64 BINUTILSPREFIX= *>&1 | Out-File fpc-rtl.log
          if ($LASTEXITCODE) { Get-Content fpc-rtl.log -Tail 6 | ForEach-Object { "::error::[rtl] $_" }; exit 1 }
          Select-String -Path fpc-rtl.log -Pattern 'clang|aarch64-win64\\system' | Select-Object -First 2 | ForEach-Object { "::notice::[rtl cmd] $($_.Line.Substring(0, [math]::Min(400, $_.Line.Length)))" }

      - name: Probe programs and a DLL
        run: |
          set -uo pipefail
          export MSYS2_ARG_CONV_EXCL='*' # keep -FuC:/... as it is
          ppc="$PWD/fpcsrc/compiler/ppcrossa64.exe"
          rtl="$(cygpath -m "$PWD/fpcsrc/rtl/units/aarch64-win64")"
          mkdir -p p && cd p
          echo "program hello; begin WriteLn('hello') end." > hello.pas
          echo "program empty; begin end." > empty.pas
          printf '%s\n' 'library plib;' '{$mode objfpc}' 'uses SysUtils;' \
            'function plib_add(a, b: longint): longint; cdecl; begin Result := a + b end;' \
            'function plib_fmt(v: longint): longint; cdecl; begin Result := Length(IntToStr(v)) end;' \
            'exports plib_add, plib_fmt;' 'begin end.' > plib.pas
          cat > host.c <<'EOF'
          #include <windows.h>
          #include <stdio.h>
          int main(void) {
              HMODULE h = LoadLibraryA("plib.dll");
              if (!h) { printf("LoadLibrary failed %lu\n", GetLastError()); return 2; }
              int (*add)(int, int) = (int (*)(int, int))GetProcAddress(h, "plib_add");
              int (*fmt)(int) = (int (*)(int))GetProcAddress(h, "plib_fmt");
              if (!add || !fmt) { printf("GetProcAddress failed\n"); return 3; }
              printf("add=%d fmt=%d\n", add(2, 3), fmt(12345));
              FreeLibrary(h);
              return 0;
          }
          EOF
          clang -O2 -o host.exe host.c || echo "::error::host.c did not build"
          run() { # name, then the command
            local name="$1"; shift
            local out code
            out="$("$@" 2>&1)"; code=$?
            echo "::warning::[${{ matrix.source }}] $name: exit $code: $(echo "$out" | tr '\n' ' ' | cut -c1-160)"
          }
          for opt in "" "-Xe" "-O-" "-Xe -O-"; do
            tag="${opt:-default}"
            for prog in empty hello; do
              rm -f "$prog.exe"
              if "$ppc" -Fu"$rtl" $opt "$prog.pas" > "build-$prog.log" 2>&1; then
                run "$prog [$tag]" "./$prog.exe"
              else
                echo "::warning::[${{ matrix.source }}] $prog [$tag]: compile failed: $(grep -iE 'error|fatal' "build-$prog.log" | head -n 3 | tr '\n' ' ' | cut -c1-200)"
              fi
            done
            rm -f plib.dll
            if "$ppc" -Fu"$rtl" $opt plib.pas > build-plib.log 2>&1; then
              run "plib.dll via host.exe [$tag]" ./host.exe
            else
              echo "::warning::[${{ matrix.source }}] plib [$tag]: compile failed: $(grep -iE 'error|fatal' build-plib.log | head -n 3 | tr '\n' ' ' | cut -c1-200)"
            fi
          done
          "$ppc" -Fu"$rtl" hello.pas > /dev/null 2>&1
          llvm-objdump -p hello.exe 2>/dev/null | grep -E 'Magic|Subsystem|DllCharacteristics|AddressOfEntryPoint|ImageBase|SizeOfStackReserve' |
            tr -s ' ' | paste -sd ';' - | sed "s/^/::notice::[${{ matrix.source }}] hello.exe header: /"
          exit 0

      - name: Exception code of hello.exe
        shell: pwsh
        run: |
          Set-Location p
          & .\hello.exe
          "::warning::[${{ matrix.source }}] hello.exe from pwsh: exit 0x{0:X8}" -f $LASTEXITCODE
          $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 3 -ErrorAction SilentlyContinue
          $ev | ForEach-Object { "::warning::[${{ matrix.source }}] event: $(($_.Message -split "`n" | Select-Object -First 8 | ForEach-Object { $_.Trim() }) -join ' | ')" }

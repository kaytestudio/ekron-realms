name: Desktop client (Windows)

on:
  workflow_dispatch:
  # release.yml builds the release assets with this workflow
  workflow_call:
  push:
    # branches only: a version tag is built once, by release.yml
    branches: ['**']
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'RINGSCE_v2.png'
      - 'Resources/**'
      - '!Resources/Info.plist'
      - 'sys/desktop/**'
      - 'realms/**'
      - 'game/**'
      - 'tests/realms/**'
      - 'tests/native/**'
      - 'tools/check_glsl_keywords.py'
      - 'sys/android/app/src/main/cpp/**'
      - 'sys/android/app/src/main/assets/**'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'RINGSCE_v2.png'
      - 'Resources/**'
      - '!Resources/Info.plist'
      - 'sys/desktop/**'
      - 'realms/**'
      - 'game/**'
      - 'tests/realms/**'
      - 'tests/native/**'
      - 'tools/check_glsl_keywords.py'
      - 'sys/android/app/src/main/cpp/**'
      - 'sys/android/app/src/main/assets/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

env:
  SDL2_VERSION: 2.32.10

jobs:
  windows-zip:
    name: Windows x64 package (.zip)
    # Windows Server 2025 is the server edition of Windows 11 24H2.
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          submodules: false

      - name: Install MinGW-w64 (UCRT64) toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: minimal
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            unzip

      # Official SDL2 MinGW build: SDL2.dll needs only system DLLs.
      - name: Download SDL2 ${{ env.SDL2_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          mkdir -p sdl2-mingw
          tar -xzf /tmp/sdl2.tar.gz -C sdl2-mingw --strip-components=1
          test -f sdl2-mingw/x86_64-w64-mingw32/bin/SDL2.dll

      # Free Pascal (native x86_64-win64) for realms_core.dll and realms_game.dll,
      # from the Lazarus installer; only its fpc folder is kept between runs.
      - name: Restore Free Pascal
        id: fpc-cache
        uses: actions/cache@v5
        with:
          path: C:\lazarus\fpc
          key: fpc-lazarus-win64-v1

      - name: Install Free Pascal (Lazarus)
        if: steps.fpc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install lazarus -y --no-progress

      - name: Locate fpc.exe
        shell: pwsh
        run: |
          $fpc = Get-ChildItem C:\lazarus\fpc -Recurse -Filter fpc.exe |
            Where-Object { $_.DirectoryName -like '*\x86_64-win64' } | Select-Object -First 1
          if (-not $fpc) { throw "fpc.exe (x86_64-win64) not found under C:\lazarus\fpc" }
          & $fpc.FullName -iV
          "FPC_EXE=$($fpc.FullName -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build Windows desktop client
        run: |
          set -o pipefail
          {
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL2_DIR="$PWD/sdl2-mingw/cmake" \
              -DFPC_EXECUTABLE="$FPC_EXE" \
              -DENABLE_PASCAL_CORE=ON \
              -DENABLE_GAME_MODULE=ON \
              -DEKRON_REQUIRE_INTRO_VIDEO=ON &&
            cmake --build build -j"$(nproc)" &&
            test -f build/ekron-realms.exe &&
            test -f build/SDL2.dll &&
            test -f build/realms_core.dll &&
            test -f build/realms_game.dll
          } 2>&1 | tee /tmp/windows-build.log || {
            tail -n 8 /tmp/windows-build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::[windows-build] $line"
            done
            exit 1
          }
          grep -q 'Intro video backend: MediaFoundation' /tmp/windows-build.log

      - name: Run CTest smoke checks
        run: |
          set -uo pipefail
          ctest --test-dir build --output-on-failure -V 2>&1 | tee /tmp/ctest.log && exit 0
          # Failures as annotations (visible without the log; at most 10
          # per step): the failed tests, then their failure lines in groups.
          echo "::error::[ctest] $(sed -n '/tests FAILED:/,$p' /tmp/ctest.log | grep -E '^\s*[0-9]+ - ' | sed 's/^\s*//' | paste -sd ';' -)"
          grep -iE 'fail|error|exception|assert|timeout|not run|missing|cannot' /tmp/ctest.log |
            grep -vE ' Passed|tests FAILED|^\s*[0-9]+ - |Test timeout computed' | head -n 72 |
            paste -d '|' - - - - - - - - | while IFS= read -r group; do echo "::error::[ctest] $group"; done
          exit 1

      - name: Build and verify the Windows package
        run: |
          set -euo pipefail
          (cd build && cpack -G ZIP)
          ZIP="$(ls build/ekron-realms-*-windows-x64.zip | head -n 1)"
          test -f "$ZIP"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg && unzip -q "$ZIP" -d /tmp/pkg
          APP="$(ls -d /tmp/pkg/ekron-realms-*-windows-x64)"
          ls "$APP"
          # Only SDL2.dll and the two Free Pascal DLLs ship next to the exe;
          # everything else must come with Windows.
          for f in "$APP"/*.exe "$APP"/*.dll; do
            objdump -p "$f" | sed -n 's/^\s*DLL Name: //p' | while read -r dll; do
              if [ -f "$APP/$dll" ] || [ -f "/c/Windows/System32/$dll" ] || [[ "${dll,,}" == api-ms-win-* ]]; then
                continue
              fi
              echo "::error::$(basename "$f") needs $dll, which is neither in the package nor in System32"
              exit 1
            done
          done
          objdump -p "$APP/ekron-realms.exe" | grep -q 'Subsystem\s*00000002' # GUI: no console window
          # From the extracted folder: no MinGW (/ucrt64/bin) or build tree on PATH.
          export PATH="/usr/bin:/c/Windows/System32:/c/Windows"
          cd /tmp
          "$APP/ekron-realms.exe" --version
          "$APP/ekron-realms.exe" --headless-smoke
          "$APP/ekron-realms.exe" --engine-info | tee /tmp/engine-info.log
          # The packaged client boots on the Free Pascal Quake 2 core and hosts the game module.
          REALMS_CORE=pascal "$APP/ekron-realms.exe" --headless-smoke | tee /tmp/pascal-smoke.log
          grep -q 'realmsCore=pascal-quake2' /tmp/pascal-smoke.log
          grep -q 'Quake 2 game API 3' /tmp/engine-info.log

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ekron-realms-windows-zip
          path: build/ekron-realms-*-windows-x64.zip
          if-no-files-found: error

  # Windows 11 on ARM (Snapdragon X, ...): the same package, native ARM64.
  # LLVM-MinGW (MSYS2 CLANGARM64) for the C++, SDL2 built from source (its
  # MinGW release has no ARM64 build), and a Free Pascal aarch64-win64 cross
  # compiler for the core and the game module. No Free Pascal release targets
  # aarch64-win64 yet, and programs from the main branch's compiler crash at
  # startup (37918075: even an empty program), so it is built from Tino
  # Teuber's fork of main with the aarch64-win64 fixes (pinned), bootstrapped
  # with the x86_64 Lazarus compiler under x64 emulation, and cached.
  windows-arm64-zip:
    name: Windows 11 ARM64 package (.zip)
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      FPC_REPO: https://gitlab.com/tino-teuber/fpc-source.git
      FPC_COMMIT: 5103b1d92d7888c4cd0d4948ee4dde47819f51c0
      FPC_ARM64: C:\fpc-aarch64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          submodules: false

      - name: Install LLVM-MinGW (CLANGARM64) toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          path-type: minimal
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-python
            unzip

      - name: Restore SDL2 ${{ env.SDL2_VERSION }} (ARM64)
        id: sdl2-cache
        uses: actions/cache@v5
        with:
          path: sdl2-arm64
          key: sdl2-clangarm64-${{ env.SDL2_VERSION }}-v1

      - name: Build SDL2 ${{ env.SDL2_VERSION }} for ARM64
        if: steps.sdl2-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/sdl2-src.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          mkdir -p /tmp/sdl2-src
          tar -xzf /tmp/sdl2-src.tar.gz -C /tmp/sdl2-src --strip-components=1
          cmake -S /tmp/sdl2-src -B /tmp/sdl2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl2-arm64" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build /tmp/sdl2-build -j"$(nproc)"
          cmake --install /tmp/sdl2-build

      - name: Check SDL2 (ARM64)
        run: |
          set -euo pipefail
          test -f sdl2-arm64/bin/SDL2.dll
          test -f sdl2-arm64/lib/cmake/SDL2/SDL2Config.cmake
          llvm-objdump -f sdl2-arm64/bin/SDL2.dll | grep -Eiq 'arm64|aarch64'

      - name: Restore Free Pascal (aarch64-win64)
        id: fpc-arm64-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\fpc-aarch64
          key: fpc-aarch64-win64-${{ env.FPC_COMMIT }}-v1

      # The bootstrap compiler: Lazarus's x86_64 Free Pascal 3.2.2 (the x64 job's cache).
      - name: Restore the bootstrap Free Pascal (Lazarus, x86_64)
        if: steps.fpc-arm64-cache.outputs.cache-hit != 'true'
        id: fpc-cache
        uses: actions/cache@v5
        with:
          path: C:\lazarus\fpc
          key: fpc-lazarus-win64-v1

      - name: Install the bootstrap Free Pascal (Lazarus, x86_64)
        if: steps.fpc-arm64-cache.outputs.cache-hit != 'true' && steps.fpc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install lazarus -y --no-progress

      - name: Free Pascal sources (pinned)
        if: steps.fpc-arm64-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q fpcsrc
          git -C fpcsrc fetch -q --depth 1 "$FPC_REPO" "$FPC_COMMIT" ||
            git -C fpcsrc fetch -q --depth 500 "$FPC_REPO" main
          git -C fpcsrc checkout -q "$FPC_COMMIT"
          test "$(git -C fpcsrc rev-parse HEAD)" = "$FPC_COMMIT"

      # "make cycle" for another CPU: the main RTL and a native compiler
      # (x86_64), then ppcrossa64 (itself x86_64) with them; NoNativeBinaries
      # implies CROSSINSTALL, so the aarch64-win64 RTL is built after it with
      # ppcrossa64. The core and the game module need nothing else (SysUtils,
      # Math, Strings, ctypes, Windows). Free Pascal's own make.exe and tools
      # first on PATH, clang (CLANGARM64) as the ARM64 assembler.
      - name: Build Free Pascal for aarch64-win64
        if: steps.fpc-arm64-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ppc = Get-ChildItem C:\lazarus\fpc -Recurse -Filter ppcx64.exe |
            Where-Object { $_.DirectoryName -like '*\x86_64-win64' } | Select-Object -First 1
          if (-not $ppc) { throw "ppcx64.exe (x86_64-win64) not found under C:\lazarus\fpc" }
          $bin = $ppc.DirectoryName
          if (-not (Test-Path "$bin\make.exe")) { throw "make.exe not found next to $($ppc.FullName)" }
          $clang = Join-Path $env:MSYS2_ROOT 'clangarm64\bin'
          if (-not (Test-Path "$clang\clang.exe")) { throw "clang.exe not found in $clang" }
          $env:PATH = "$bin;$clang;$env:SystemRoot\System32;$env:SystemRoot"
          & $ppc.FullName -iV
          $ErrorActionPreference = 'Continue' # compiler output on stderr is not a script error
          function Invoke-Make([string]$what, [string[]]$makeArgs) {
            & "$bin\make.exe" @makeArgs *>&1 | Tee-Object -FilePath "fpc-$what.log" | Out-Null
            $code = $LASTEXITCODE
            Get-Content "fpc-$what.log" -Tail 30
            if ($code -ne 0) {
              Get-Content "fpc-$what.log" -Tail 8 | Where-Object { $_.Trim() } | ForEach-Object { "::error::[fpc-$what] $($_.Trim())" }
              exit 1
            }
          }
          Invoke-Make 'cycle' @('-C', 'fpcsrc/compiler', 'cycle', "PP=$($ppc.FullName -replace '\\','/')",
            'CPU_TARGET=aarch64', 'OS_TARGET=win64', 'BINUTILSPREFIX=', 'NoNativeBinaries=1')
          $cross = Resolve-Path fpcsrc\compiler\ppcrossa64.exe -ErrorAction SilentlyContinue
          if (-not $cross) { "::error::fpcsrc\compiler\ppcrossa64.exe not built"; exit 1 }
          Invoke-Make 'rtl' @('-C', 'fpcsrc/rtl', 'all', "FPC=$("$cross" -replace '\\','/')",
            'CPU_TARGET=aarch64', 'OS_TARGET=win64', 'BINUTILSPREFIX=')
          if (-not (Test-Path fpcsrc\rtl\units\aarch64-win64\sysutils.ppu)) { "::error::the aarch64-win64 RTL was not built"; exit 1 }
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:FPC_ARM64\bin", "$env:FPC_ARM64\units\rtl" | Out-Null
          Copy-Item $cross "$env:FPC_ARM64\bin\"
          Copy-Item fpcsrc\rtl\units\aarch64-win64\* "$env:FPC_ARM64\units\rtl\" -Recurse
          Copy-Item fpcsrc\rtl\COPYING.FPC "$env:FPC_ARM64\" -ErrorAction SilentlyContinue
          # Free Pascal reads fpc.cfg from the compiler's own folder
          Set-Content -Encoding ascii "$env:FPC_ARM64\bin\fpc.cfg" "-Fu$($env:FPC_ARM64 -replace '\\','/')/units/rtl"

      - name: Save Free Pascal (aarch64-win64)
        if: steps.fpc-arm64-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\fpc-aarch64
          key: fpc-aarch64-win64-${{ env.FPC_COMMIT }}-v1

      # A program and a DLL (what the game loads) built, run and loaded.
      - name: Check the Free Pascal ARM64 compiler
        run: |
          set -euo pipefail
          trap 'echo "::error::[fpc-check] failed: $BASH_COMMAND"' ERR
          export MSYS2_ARG_CONV_EXCL='*' # MSYS2 would rewrite C:/... arguments
          ppc="$(cygpath -m "$FPC_ARM64")/bin/ppcrossa64.exe"
          "$ppc" -iV
          test "$("$ppc" -iTP)" = aarch64
          test "$("$ppc" -iTO)" = win64
          mkdir -p fpc-smoke && cd fpc-smoke
          cat > smoke.pas <<'EOF'
          program smoke;
          uses SysUtils, Math, ctypes;
          begin
            WriteLn(Format('fpc %s %d %d', [FloatToStrF(Sqrt(2.0), ffFixed, 8, 4), SizeOf(cint), Floor(2.5)]));
          end.
          EOF
          cat > plib.pas <<'EOF'
          library plib;
          {$mode objfpc}
          uses SysUtils;
          function plib_len(v: longint): longint; cdecl;
          begin
            try
              raise Exception.Create(IntToStr(v));
            except
              on E: Exception do Result := Length(E.Message);
            end;
          end;
          exports plib_len;
          begin
          end.
          EOF
          cat > host.c <<'EOF'
          #include <windows.h>
          #include <stdio.h>
          int main(void) {
              HMODULE h = LoadLibraryA("plib.dll");
              if (!h) { printf("LoadLibrary failed %lu\n", GetLastError()); return 2; }
              int (*len)(int) = (int (*)(int))GetProcAddress(h, "plib_len");
              if (!len) { printf("GetProcAddress failed\n"); return 3; }
              printf("len=%d\n", len(12345));
              FreeLibrary(h);
              return 0;
          }
          EOF
          "$ppc" -Mobjfpc -O2 smoke.pas
          ./smoke.exe | tee out.txt
          grep -q 'fpc 1.4142 4 2' out.txt
          "$ppc" -O2 plib.pas
          clang -O2 -o host.exe host.c
          ./host.exe | tee host.txt
          grep -q 'len=5' host.txt
          echo "FPC_EXE=$ppc" >> "$GITHUB_ENV"

      - name: Configure and build Windows ARM64 desktop client
        run: |
          set -o pipefail
          {
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL2_DIR="$PWD/sdl2-arm64/lib/cmake/SDL2" \
              -DFPC_EXECUTABLE="$FPC_EXE" \
              -DENABLE_FPC_CLIENT=OFF \
              -DENABLE_PASCAL_CORE=ON \
              -DENABLE_GAME_MODULE=ON \
              -DEKRON_REQUIRE_INTRO_VIDEO=ON &&
            cmake --build build -j"$(nproc)" &&
            test -f build/ekron-realms.exe &&
            test -f build/SDL2.dll &&
            test -f build/realms_core.dll &&
            test -f build/realms_game.dll
          } 2>&1 | tee /tmp/windows-arm64-build.log || {
            tail -n 8 /tmp/windows-arm64-build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::[windows-arm64-build] $line"
            done
            exit 1
          }
          grep -q 'Intro video backend: MediaFoundation' /tmp/windows-arm64-build.log

      - name: Run CTest smoke checks
        run: |
          set -uo pipefail
          ctest --test-dir build --output-on-failure -V 2>&1 | tee /tmp/ctest.log && exit 0
          echo "::error::[ctest] $(sed -n '/tests FAILED:/,$p' /tmp/ctest.log | grep -E '^\s*[0-9]+ - ' | sed 's/^\s*//' | paste -sd ';' -)"
          grep -iE 'fail|error|exception|assert|timeout|not run|missing|cannot' /tmp/ctest.log |
            grep -vE ' Passed|tests FAILED|^\s*[0-9]+ - |Test timeout computed' | head -n 72 |
            paste -d '|' - - - - - - - - | while IFS= read -r group; do echo "::error::[ctest] $group"; done
          exit 1

      - name: Build and verify the Windows ARM64 package
        run: |
          set -euo pipefail
          (cd build && cpack -G ZIP)
          ZIP="$(ls build/ekron-realms-*-windows-arm64.zip | head -n 1)"
          test -f "$ZIP"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg && unzip -q "$ZIP" -d /tmp/pkg
          APP="$(ls -d /tmp/pkg/ekron-realms-*-windows-arm64)"
          ls "$APP"
          # Native ARM64 binaries only, needing nothing but each other and Windows.
          for f in "$APP"/*.exe "$APP"/*.dll; do
            llvm-objdump -f "$f" | grep -Eiq 'arm64|aarch64' || { echo "::error::$(basename "$f") is not an ARM64 binary"; exit 1; }
            llvm-objdump -p "$f" | sed -n 's/^\s*DLL Name: //p' | while read -r dll; do
              if [ -f "$APP/$dll" ] || [ -f "/c/Windows/System32/$dll" ] || [[ "${dll,,}" == api-ms-win-* ]]; then
                continue
              fi
              echo "::error::$(basename "$f") needs $dll, which is neither in the package nor in System32"
              exit 1
            done
          done
          llvm-objdump -p "$APP/ekron-realms.exe" | grep -Eq 'Subsystem\s+0*2(\s|$)' # GUI: no console window
          export PATH="/usr/bin:/c/Windows/System32:/c/Windows"
          cd /tmp
          "$APP/ekron-realms.exe" --version | tee /tmp/version.log
          grep -q 'Windows arm64' /tmp/version.log
          "$APP/ekron-realms.exe" --headless-smoke
          "$APP/ekron-realms.exe" --engine-info | tee /tmp/engine-info.log
          # The packaged client boots on the Free Pascal Quake 2 core and hosts the game module.
          REALMS_CORE=pascal "$APP/ekron-realms.exe" --headless-smoke | tee /tmp/pascal-smoke.log
          grep -q 'realmsCore=pascal-quake2' /tmp/pascal-smoke.log
          grep -q 'Quake 2 game API 3' /tmp/engine-info.log

      - name: Upload Windows ARM64 package
        uses: actions/upload-artifact@v7
        with:
          name: ekron-realms-windows-arm64-zip
          path: build/ekron-realms-*-windows-arm64.zip
          if-no-files-found: error

  # The same client with Visual C++ (C++ only: the package comes from the
  # MinGW job above).
  windows-msvc:
    name: Windows x64 build (Visual C++)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          submodules: false

      - name: Download SDL2 ${{ env.SDL2_VERSION }}
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sdl2-vc.zip"
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath sdl2-vc
          $root = (Get-ChildItem sdl2-vc -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$root\lib\x64\SDL2.dll")) { throw "SDL2.dll missing from the VC package" }
          "SDL2_ROOT=$($root -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The default generator: the newest Visual Studio on the runner.
      - name: Configure and build with Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue' # compiler output on stderr is not a script error
          $ok = $true
          & {
            cmake -S . -B build -A x64 `
              -DSDL2_DIR="$env:SDL2_ROOT/cmake" `
              -DENABLE_FPC_CLIENT=OFF -DENABLE_PASCAL_CORE=OFF -DENABLE_GAME_MODULE=OFF `
              -DEKRON_REQUIRE_INTRO_VIDEO=ON
            if ($LASTEXITCODE) { $script:ok = $false; return }
            cmake --build build --config Release --parallel -- /nologo /verbosity:minimal
            if ($LASTEXITCODE) { $script:ok = $false; return }
          } *>&1 | Tee-Object -FilePath build-msvc.log
          if ($ok) {
            if (-not (Test-Path build\Release\ekron-realms.exe)) { "::error::ekron-realms.exe not built"; $ok = $false }
            if (-not (Test-Path build\Release\SDL2.dll)) { "::error::SDL2.dll not copied next to the exe"; $ok = $false }
          } else {
            # Errors as annotations (visible without the log): compiler and
            # linker errors, else the end of the output.
            $errors = Select-String -Path build-msvc.log -Pattern '(: (fatal )?error )|CMake Error' -Context 0,3 | Select-Object -First 20
            if ($errors) {
              $errors | ForEach-Object { "::error::[msvc] $(($(@($_.Line) + $_.Context.PostContext) | ForEach-Object { $_.Trim() }) -join ' | ')" }
            }
            else { Get-Content build-msvc.log -Tail 25 | Where-Object { $_.Trim() } | ForEach-Object { "::error::[msvc] $($_.Trim())" } }
          }
          if (-not $ok) { exit 1 }

      - name: Run CTest smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          ctest --test-dir build -C Release --output-on-failure -V *>&1 | Tee-Object -FilePath ctest-msvc.log
          if ($LASTEXITCODE) {
            # At most 10 annotations per step: the failed tests, then their
            # failure lines in groups.
            $log = Get-Content ctest-msvc.log
            $start = [array]::IndexOf($log, ($log | Where-Object { $_ -match 'tests FAILED:' } | Select-Object -First 1))
            if ($start -ge 0) { "::error::[ctest] $(($log[$start..($log.Count - 1)] | Where-Object { $_ -match '^\s*\d+ - ' } | ForEach-Object { $_.Trim() }) -join '; ')" }
            $lines = @($log | Where-Object { $_ -match 'fail|error|exception|assert|timeout|not run|missing|cannot' -and
                                             $_ -notmatch ' Passed|tests FAILED|^\s*\d+ - |Test timeout computed' } | Select-Object -First 72)
            for ($i = 0; $i -lt $lines.Count; $i += 8) {
              "::error::[ctest] $(($lines[$i..([math]::Min($i + 7, $lines.Count - 1))] | ForEach-Object { $_.Trim() }) -join ' | ')"
            }
            exit 1
          }

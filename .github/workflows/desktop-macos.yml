name: Desktop client (macOS)

on:
  workflow_dispatch:
  # release.yml builds the release assets with this workflow
  workflow_call:
  push:
    # branches only: a version tag is built once, by release.yml
    branches: ['**']
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'RINGSCE_v2.png'
      - 'Resources/**'
      - '!Resources/ekron-realms.desktop'
      - 'Projects/**'
      - 'sys/desktop/**'
      - 'realms/**'
      - 'tests/realms/**'
      - 'tests/native/desktop_hud_layout_test.cpp'
      - 'tests/native/desktop_gamepad_test.cpp'
      - 'tests/native/localization_test.cpp'
      - 'tests/native/shop_catalog_test.cpp'
      - 'tests/native/sound_test.cpp'
      - 'tests/native/intro_video_test.cpp'
      - 'tools/check_glsl_keywords.py'
      - 'sys/mac/**'
      - 'tests/pascal/**'
      - '.gitmodules'
      - 'tools/SDL2-for-Pascal'
      - 'sys/android/app/src/main/cpp/**'
      - 'sys/android/app/src/main/assets/**'
      - '.github/workflows/desktop-macos.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'RINGSCE_v2.png'
      - 'Resources/**'
      - '!Resources/ekron-realms.desktop'
      - 'Projects/**'
      - 'sys/desktop/**'
      - 'realms/**'
      - 'tests/realms/**'
      - 'tests/native/desktop_hud_layout_test.cpp'
      - 'tests/native/desktop_gamepad_test.cpp'
      - 'tests/native/localization_test.cpp'
      - 'tests/native/shop_catalog_test.cpp'
      - 'tests/native/sound_test.cpp'
      - 'tests/native/intro_video_test.cpp'
      - 'tools/check_glsl_keywords.py'
      - 'sys/mac/**'
      - 'tests/pascal/**'
      - '.gitmodules'
      - 'tools/SDL2-for-Pascal'
      - 'sys/android/app/src/main/cpp/**'
      - 'sys/android/app/src/main/assets/**'
      - '.github/workflows/desktop-macos.yml'

permissions:
  contents: read

jobs:
  macos-app:
    name: macOS app bundle (.app)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        shell: bash
        run: |
          set -euo pipefail
          for pkg in cmake ninja sdl2 fpc; do
            brew list "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Configure and build macOS .app bundle
        shell: bash
        run: |
          set -o pipefail
          {
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_FPC_CLIENT=ON \
              -DENABLE_PASCAL_CORE=ON \
              -DEKRON_REQUIRE_INTRO_VIDEO=ON &&
            cmake --build build -j"$(sysctl -n hw.ncpu)"
          } 2>&1 | tee /tmp/macos-build.log || {
            { grep -B2 -A6 -E 'Undefined symbols|error:|Error:' /tmp/macos-build.log | head -n 40; tail -n 8 /tmp/macos-build.log; } | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::[macos-build] $line"
            done
            exit 1
          }

      - name: Pascal SDL2 bindings for the sys layer (tools/SDL2-for-Pascal submodule)
        shell: bash
        run: |
          set -euo pipefail
          # sys/mac/sys_mac.pas and Projects/realms.lpi use these units (issue #1).
          git submodule update --init --depth 1 tools/SDL2-for-Pascal
          mkdir -p /tmp/sdl2u
          cd Projects
          fpc -Mobjfpc -FU/tmp/sdl2u -FE/tmp/sdl2u "-Fl$(brew --prefix sdl2)/lib" ../tests/pascal/sdl2_sys_smoke.lpr
          /tmp/sdl2u/sdl2_sys_smoke

      - name: Bundle SDL2 framework library and ad-hoc sign .app
        shell: bash
        run: |
          set -euo pipefail
          APP_BUNDLE="build/EkronRealms.app"
          test -d "$APP_BUNDLE/Contents/MacOS"
          test -f "$APP_BUNDLE/Contents/Info.plist"
          test -f "$APP_BUNDLE/Contents/Resources/models/abandoned_city_street_for_games.glb"
          test -x "$APP_BUNDLE/Contents/MacOS/EkronRealms"
          test -x "$APP_BUNDLE/Contents/MacOS/realms-launcher"
          test -f "$APP_BUNDLE/Contents/Frameworks/librealms_core.dylib"
          # Free Pascal client: realms-pascal + the C++ sandbox it runs (libekron_sandbox).
          test -x "$APP_BUNDLE/Contents/MacOS/realms-pascal"
          test -f "$APP_BUNDLE/Contents/Frameworks/libekron_sandbox.dylib"

          mkdir -p "$APP_BUNDLE/Contents/Frameworks"
          SDL2_REF="$(otool -L "$APP_BUNDLE/Contents/MacOS/EkronRealms" | awk '/libSDL2/{print $1; exit}')"
          SDL2_SRC="$SDL2_REF"
          if [ -n "$SDL2_REF" ] && [ ! -f "$SDL2_SRC" ]; then
            BREW_SDL2_LIB="$(brew --prefix sdl2)/lib/$(basename "$SDL2_REF")"
            if [ -f "$BREW_SDL2_LIB" ]; then
              SDL2_SRC="$BREW_SDL2_LIB"
            fi
          fi
          if [ -n "$SDL2_REF" ] && [ -f "$SDL2_SRC" ]; then
            DYLIB_NAME="$(basename "$SDL2_SRC")"
            cp -L "$SDL2_SRC" "$APP_BUNDLE/Contents/Frameworks/$DYLIB_NAME"
            chmod 755 "$APP_BUNDLE/Contents/Frameworks/$DYLIB_NAME"
            install_name_tool -id "@rpath/$DYLIB_NAME" "$APP_BUNDLE/Contents/Frameworks/$DYLIB_NAME"
            install_name_tool -change "$SDL2_REF" "@rpath/$DYLIB_NAME" "$APP_BUNDLE/Contents/MacOS/EkronRealms"
            SANDBOX_LIB="$APP_BUNDLE/Contents/Frameworks/libekron_sandbox.dylib"
            SANDBOX_SDL2_REF="$(otool -L "$SANDBOX_LIB" | awk '/libSDL2/{print $1; exit}')"
            if [ -n "$SANDBOX_SDL2_REF" ]; then
              install_name_tool -change "$SANDBOX_SDL2_REF" "@rpath/$DYLIB_NAME" "$SANDBOX_LIB"
            fi

            # Homebrew sdl2-compat dlopens "@loader_path/libSDL3.dylib" inside Contents/Frameworks
            SDL3_REF="$(otool -L "$APP_BUNDLE/Contents/Frameworks/$DYLIB_NAME" | awk '/libSDL3/{print $1; exit}')"
            if [ -n "$SDL3_REF" ] && [ -f "$SDL3_REF" ]; then
              SDL3_NAME="$(basename "$SDL3_REF")"
              cp -L "$SDL3_REF" "$APP_BUNDLE/Contents/Frameworks/$SDL3_NAME"
              chmod 755 "$APP_BUNDLE/Contents/Frameworks/$SDL3_NAME"
              install_name_tool -id "@rpath/$SDL3_NAME" "$APP_BUNDLE/Contents/Frameworks/$SDL3_NAME"
              install_name_tool -change "$SDL3_REF" "@rpath/$SDL3_NAME" "$APP_BUNDLE/Contents/Frameworks/$DYLIB_NAME"
              if [ "$SDL3_NAME" != "libSDL3.dylib" ]; then
                ln -sf "$SDL3_NAME" "$APP_BUNDLE/Contents/Frameworks/libSDL3.dylib"
              fi
            elif brew --prefix sdl3 >/dev/null 2>&1; then
              SDL3_DIR="$(brew --prefix sdl3)/lib"
              if [ -f "$SDL3_DIR/libSDL3.dylib" ]; then
                cp -L "$SDL3_DIR/libSDL3.dylib" "$APP_BUNDLE/Contents/Frameworks/libSDL3.dylib"
                chmod 755 "$APP_BUNDLE/Contents/Frameworks/libSDL3.dylib"
                install_name_tool -id "@rpath/libSDL3.dylib" "$APP_BUNDLE/Contents/Frameworks/libSDL3.dylib"
                ln -sf "libSDL3.dylib" "$APP_BUNDLE/Contents/Frameworks/libSDL3.0.dylib"
              fi
            fi
          fi

          codesign --force --deep --sign - "$APP_BUNDLE"

      - name: Verify standalone EkronRealms.app
        shell: bash
        run: |
          set -euo pipefail
          if ! ctest --test-dir build --output-on-failure > /tmp/ctest.log 2>&1; then
            cat /tmp/ctest.log
            # Raw logs are not always reachable: put the failures in one annotation.
            msg="$(grep -iE 'fail|\*\*\*|rror|xception|signal|Segmentation|Abort|not found|missing|Game:' /tmp/ctest.log | grep -v ' Passed ' | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=ctest (macOS)::${msg}"
            {
              ls -l build/EkronRealms.app/Contents/Frameworks/ build/*.dylib 2>&1 || true
              for lib in build/EkronRealms.app/Contents/Frameworks/librealms_game*; do
                file "$lib"; nm -gU "$lib" | grep -i getgame || echo "no GetGameAPI export"
              done
              build/EkronRealms.app/Contents/MacOS/EkronRealms --engine-info 2>&1 || true
            } > /tmp/diag.log 2>&1
            echo "::error title=game module (macOS)::$(sed 's/%/%25/g' /tmp/diag.log | tail -n 40 | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat /tmp/ctest.log
          APP_BUNDLE="build/EkronRealms.app"
          "$APP_BUNDLE/Contents/MacOS/EkronRealms" --version
          "$APP_BUNDLE/Contents/MacOS/EkronRealms" --headless-smoke
          "$APP_BUNDLE/Contents/MacOS/EkronRealms" --engine-info | tee /tmp/engine-info.log
          # Map mode hosts the Quake 2 game module (game/) through realms::GameServer.
          test -f "$APP_BUNDLE/Contents/Frameworks/librealms_game.dylib"
          grep -q 'Quake 2 game API 3' /tmp/engine-info.log
          REALMS_CORE=pascal "$APP_BUNDLE/Contents/MacOS/EkronRealms" --headless-smoke | tee /tmp/pascal-smoke.log
          grep -q 'realmsCore=pascal-quake2' /tmp/pascal-smoke.log
          "$APP_BUNDLE/Contents/MacOS/realms-launcher" --version
          "$APP_BUNDLE/Contents/MacOS/realms-launcher" --headless-smoke
          # Free Pascal program: Pascal Realms core linked in, C++ SDL2 sandbox.
          "$APP_BUNDLE/Contents/MacOS/realms-pascal" --version
          "$APP_BUNDLE/Contents/MacOS/realms-pascal" --engine-info | tee /tmp/realms-pascal-info.log
          grep -q 'Origin:   linked' /tmp/realms-pascal-info.log
          "$APP_BUNDLE/Contents/MacOS/realms-pascal" --headless-smoke | tee /tmp/realms-pascal-smoke.log
          grep -q 'realmsCore=pascal-quake2' /tmp/realms-pascal-smoke.log
          otool -L "$APP_BUNDLE/Contents/Frameworks/libekron_sandbox.dylib"

          ditto -c -k --keepParent "$APP_BUNDLE" build/EkronRealms-macos.app.zip
          test -f build/EkronRealms-macos.app.zip

      - name: Upload macOS .app bundle
        uses: actions/upload-artifact@v7
        with:
          name: ekron-realms-macos-app
          path: build/EkronRealms-macos.app.zip
          if-no-files-found: error

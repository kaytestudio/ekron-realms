// Realms Engine - default configuration shared by Desktop, Android and iOS.
//
// Quake 2 console syntax, executed by the Realms core (Free Pascal Quake 2
// stack, or the C++ reference core) before the player's saved config.cfg
// and autoexec.cfg. Desktop: press ` to open the console.
//
//   set <cvar> <value>      seta = set + save to config.cfg
//   alias <name> "<cmds>"   several commands go inside the quotes
//   exec <file>             run another script (loose file or inside a .pak)
//
// Note: like Quake 2, a semicolon ends a command even inside a comment line,
// so never put one in a comment here.

set sv_hostname "Ekron Realms"
set realms_game "ekron-urban-sandbox"

// Short-hands for the sandbox commands (not every platform has all of them).
alias home "respawn"
alias road "teleport_road"
alias car "restore_car"
alias fly "noclip"
alias slow "set sensitivity 2"
alias fast "set sensitivity 5"

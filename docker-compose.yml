# Builds the Docker image (see Dockerfile) and copies the build products
# (.deb, ekron-realms, realms-pascal, libraries) to ./output on the host.
services:
  ekron-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: ekron-builder
    container_name: ekron_realms_builder
    volumes:
      - ./output:/output
    command: sh -c "cp -r /app/dist/. /output/ && echo '--- Build products ---' && ls -l /output"
